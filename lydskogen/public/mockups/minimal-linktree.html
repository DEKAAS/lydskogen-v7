<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalistisk Linktree - Eksempel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      max-width: 400px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 40px 30px;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    
    .profile {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      border: 3px solid rgba(255, 255, 255, 0.2);
    }
    
    .name {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    
    .bio {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.5;
    }
    
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .link {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: #fff;
      transition: all 0.2s;
      backdrop-filter: blur(10px);
    }
    
    .link:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }
    
    .link-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: rgba(255, 255, 255, 0.1);
    }
    
    .link-text {
      flex: 1;
      font-size: 16px;
      font-weight: 500;
    }
    
    .link-arrow {
      opacity: 0.5;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile">
      <div class="avatar">🎵</div>
      <div class="name">Artist Navn</div>
      <div class="bio">Musikkprodusent & Artist</div>
    </div>
    
    <div class="links">
      <a href="#" class="link">
        <div class="link-icon">🎵</div>
        <div class="link-text">Spotify</div>
        <div class="link-arrow">→</div>
      </a>
      <a href="#" class="link">
        <div class="link-icon">📷</div>
        <div class="link-text">Instagram</div>
        <div class="link-arrow">→</div>
      </a>
      <a href="#" class="link">
        <div class="link-icon">▶️</div>
        <div class="link-text">YouTube</div>
        <div class="link-arrow">→</div>
      </a>
      <a href="#" class="link">
        <div class="link-icon">💿</div>
        <div class="link-text">Bandcamp</div>
        <div class="link-arrow">→</div>
      </a>
    </div>
  </div>
</body>
</html>
